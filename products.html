<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | Big Mart</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body data-page="products"><div id="site-header"></div><main class="container"><div class="page-title"><span class="eyebrow">BIG MART STORE</span><h1>All Products</h1><p id="resultText">Browse our supermarket collection.</p></div><div class="shop-layout"><aside class="filters"><div class="filter-title">Filters <button onclick="clearFilters()" class="clear-btn">Clear</button></div><label>Category<select id="categoryFilter"><option value="">All categories</option></select></label><label>Brand<select id="brandFilter"><option value="">All brands</option></select></label><label>Max Price<input id="priceFilter" type="range" min="0" max="3000" step="50" value="3000"><output id="priceValue">Rs. 3000</output></label><label>Minimum Rating<select id="ratingFilter"><option value="0">Any rating</option><option value="4">4★ & above</option><option value="4.5">4.5★ & above</option></select></label><label>Availability<select id="stockFilter"><option value="">All</option><option value="in">In stock</option><option value="low">Low stock</option></select></label></aside><section><div class="shop-toolbar"><button class="mobile-filter btn ghost" onclick="document.querySelector('.filters').classList.toggle('open')">☰ Filters</button><input id="shopSearch" class="inline-search" placeholder="Search products..."><select id="sortSelect"><option value="popular">Popular</option><option value="newest">Newest</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rating">Highest Rated</option><option value="discount">Biggest Discount</option></select></div><div id="productGrid" class="product-grid"></div></section></div></main><div id="site-footer"></div><div id="toast"></div><script src="js/data.js"></script><script src="js/app.js"></script><script src="js/products.js"></script></body></html>
